# Môi trường phát triển cục bộ: Firebase Emulator (Auth + Firestore + rules thật của dự án) và dữ liệu demo.
#   docker compose up -d firebase      # Emulator UI: http://localhost:4000
#   docker compose run --rm seed       # nạp officer1/customer1/customer2 + tài khoản, lãi suất, chi nhánh
#   docker compose down                # dữ liệu emulator nằm trong RAM, mất khi dừng
# Build APK: xem docker/android/Dockerfile hoặc docs/setup/docker.md.
name: tdtbank

services:
  firebase:
    build: docker/firebase
    image: tdtbank/firebase-emulator
    ports:
      - "4000:4000"   # Emulator UI
      - "4400:4400"   # Hub
      - "8080:8080"   # Firestore
      - "9099:9099"   # Auth
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
      - ./firestore.rules:/workspace/firestore.rules:ro
      - ./firestore.indexes.json:/workspace/firestore.indexes.json:ro

  seed:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    working_dir: /scripts
    environment:
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      GCLOUD_PROJECT: demo-tdtbank
    volumes:
      - ./scripts:/scripts
      - /scripts/node_modules
    command: sh -c "npm install --no-audit --no-fund && node seed-demo-data.js"
    depends_on:
      firebase:
        condition: service_healthy
